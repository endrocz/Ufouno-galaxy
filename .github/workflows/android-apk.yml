
name: Sestavit UFONO Galaxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavit Android SDK
        uses: android-actions/setup-android@v3

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Nainstalovat Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Sestavit UFONO Galaxy APK
        run: gradle --no-daemon assembleDebug

      - name: Zkontrolovat APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Nahrat APK ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: UFONO-Galaxy-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

