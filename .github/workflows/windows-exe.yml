{/* Code displayed in the copy control above */}name: UFONO Galaxy Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Stahnout hru
        uses: actions/checkout@v4
      - name: Pripravit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pripravit opraveny spoustec
        shell: pwsh
        run: |
          New-Item -ItemType Directory desktop -Force | Out-Null
          @'
          'use strict';
          const {app, BrowserWindow, dialog, shell} = require('electron');
          const fs = require('node:fs');
          const path = require('node:path');
          let server = null;
          let mainWindow = null;

          function showError(err) {
            const message = err && (err.stack || err.message) || String(err);
            try {
              const log = path.join(app.getPath('userData'), 'ufono-start-error.txt');
              fs.mkdirSync(path.dirname(log), {recursive:true});
              fs.writeFileSync(log, message, 'utf8');
            } catch (_) {}
            dialog.showErrorBox('UFONO Galaxy - chyba pri spusteni', message + '\n\nPosli nam prosim tento text chyby.');
          }

          function start() {
            mainWindow = new BrowserWindow({
              width:1200, height:800, minWidth:640, minHeight:480,
              title:'UFONO Galaxy', show:true, autoHideMenuBar:true,
              backgroundColor:'#090e27',
              webPreferences:{nodeIntegration:false, contextIsolation:true, sandbox:true}
            });
            mainWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent('<html><body style="background:#090e27;color:white;font:20px sans-serif;padding:50px">UFONO Galaxy se spousti...</body></html>'));

            const dir = path.join(app.getPath('userData'), 'ufono-game');
            fs.mkdirSync(dir, {recursive:true});
            fs.cpSync(path.join(app.getAppPath(),'public'),path.join(dir,'public'),{recursive:true,force:true});
            fs.copyFileSync(path.join(app.getAppPath(),'server.js'),path.join(dir,'server.js'));
            server = require(path.join(dir, 'server.js'));
            server.once('error', showError);
            server.listen(0,'127.0.0.1',()=>{
              const origin = 'http://127.0.0.1:' + server.address().port;
              mainWindow.loadURL(origin).catch(showError);
              mainWindow.webContents.setWindowOpenHandler(({url})=>{
                if (/^https:\/\//i.test(url)) shell.openExternal(url);
                return {action:'deny'};
              });
              mainWindow.webContents.on('will-navigate',(event,url)=>{
                if (!url.startsWith(origin + '/')) event.preventDefault();
              });
            });
          }

          process.on('uncaughtException', showError);
          process.on('unhandledRejection', showError);
          const lock = app.requestSingleInstanceLock();
          if (!lock) app.quit();
          else {
            app.on('second-instance',()=>{if(mainWindow){mainWindow.show(); mainWindow.focus();}});
            app.whenReady().then(start).catch(showError);
          }
          app.on('window-all-closed',()=>app.quit());
          app.on('before-quit',()=>{try{if(server && server.listening) server.close();}catch(_){}});
          '@ | Set-Content -Encoding utf8 desktop/main.cjs
          @'
          appId: cz.ufono.galaxy
          productName: UFONO Galaxy
          directories:
            output: dist
          files:
            - server.js
            - public/**/*
            - desktop/main.cjs
            - package.json
          extraMetadata:
            main: desktop/main.cjs
          asar: false
          win:
            target:
              - target: portable
                arch: [x64]
          artifactName: UFONO-Galaxy-${version}-${arch}.${ext}
          '@ | Set-Content -Encoding utf8 desktop/builder.yml
      - name: Sestavit opravene EXE
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock electron@35 electron-builder@26
          npx electron-builder --win portable --x64 --publish never --config desktop/builder.yml
      - name: Overit EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'EXE nebylo vytvoreno' }
          Write-Host $exe.FullName
      - name: Stahnout hru pro Windows
        uses: actions/upload-artifact@v4
        with:
          name: UFONO-Galaxy-Windows-OPRAVA
          path: dist/*.exe
          if-no-files-found: error
  
