
name: UFONO Galaxy Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pripravit Windows aplikaci
        shell: pwsh
        run: |
          New-Item -ItemType Directory desktop -Force | Out-Null

          @'
          'use strict';

          const { app, BrowserWindow, dialog } = require('electron');
          const fs = require('node:fs');
          const path = require('node:path');

          let mainWindow = null;
          let gameServer = null;
          let starting = false;

          function showError(error) {
            const message = error?.stack || String(error);

            try {
              const logFile = path.join(
                app.getPath('userData'),
                'ufono-error.txt'
              );

              fs.writeFileSync(logFile, message, 'utf8');
            } catch (ignored) {}

            dialog.showErrorBox(
              'UFONO Galaxy - chyba pri spusteni',
              message
            );
          }

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 640,
              minHeight: 480,
              show: true,
              center: true,
              autoHideMenuBar: true,
              title: 'UFONO Galaxy',
              backgroundColor: '#090e27',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true
              }
            });

            mainWindow.on('closed', () => {
              mainWindow = null;
            });

            mainWindow.webContents.on(
              'did-fail-load',
              (event, code, description, url, isMainFrame) => {
                if (isMainFrame && code !== -3) {
                  showError(
                    new Error(
                      'Nacitani hry selhalo: ' + description
                    )
                  );
                }
              }
            );

            mainWindow.webContents.on(
              'render-process-gone',
              (event, details) => {
                showError(
                  new Error(
                    'Graficky proces skoncil: ' + details.reason
                  )
                );
              }
            );

            mainWindow.show();
          }

          async function startGame() {
            if (starting) return;
            starting = true;

            createWindow();

            try {
              const source = app.getAppPath();

              const directory = path.join(
                app.getPath('userData'),
                'ufono-game'
              );

              fs.mkdirSync(directory, {
                recursive: true
              });

              fs.cpSync(
                path.join(source, 'public'),
                path.join(directory, 'public'),
                {
                  recursive: true,
                  force: true
                }
              );

              fs.copyFileSync(
                path.join(source, 'server.js'),
                path.join(directory, 'server.js')
              );

              gameServer = require(
                path.join(directory, 'server.js')
              );

              gameServer.once('error', showError);

              gameServer.listen(
                0,
                '127.0.0.1',
                async () => {
                  const address =
                    'http://127.0.0.1:' +
                    gameServer.address().port +
                    '/';

                  try {
                    if (mainWindow && !mainWindow.isDestroyed()) {
                      await mainWindow.loadURL(address);
                      mainWindow.show();
                      mainWindow.focus();
                    }
                  } catch (error) {
                    if (error.code !== -3 &&
                        error.errno !== -3) {
                      showError(error);
                    }
                  }
                }
              );

            } catch (error) {
              showError(error);
            }
          }

          process.on('uncaughtException', showError);
          process.on('unhandledRejection', showError);

          const lock = app.requestSingleInstanceLock();

          if (!lock) {
            app.quit();
          } else {
            app.on('second-instance', () => {
              if (mainWindow && !mainWindow.isDestroyed()) {
                mainWindow.show();
                mainWindow.focus();
              }
            });

            app.whenReady()
              .then(startGame)
              .catch(showError);
          }

          app.on('window-all-closed', () => {
            app.quit();
          });

          app.on('before-quit', () => {
            try {
              if (gameServer && gameServer.listening) {
                gameServer.close();
              }
            } catch (ignored) {}
          });
          '@ | Set-Content -Encoding utf8 desktop/main.cjs

          @'
          appId: cz.ufono.galaxy
          productName: UFONO Galaxy

          directories:
            output: dist

          files:
            - server.js
            - public/**/*
            - desktop/main.cjs
            - package.json

          extraMetadata:
            main: desktop/main.cjs

          asar: false

          win:
            target:
              - target: portable
                arch:
                  - x64

          artifactName: UFONO-Galaxy-${version}-${arch}.${ext}
          '@ | Set-Content -Encoding utf8 desktop/builder.yml

      - name: Instalovat nastroje
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock electron@35 electron-builder@26

      - name: Sestavit Windows EXE
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --publish never --config desktop/builder.yml

      - name: Zkontrolovat EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1

          if (-not $exe) {
            throw "Windows EXE nebylo vytvoreno"
          }

          Write-Host "Soubor vytvoren: $($exe.FullName)"

      - name: Nahrat opravenou hru
        uses: actions/upload-artifact@v4
        with:
          name: UFONO-Galaxy-Windows-OPRAVA
          path: dist/*.exe
          if-no-files-found: error
